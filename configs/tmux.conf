# Ensure Homebrew binaries are visible to run-shell scripts (e.g. TPM)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

set -g history-limit 100000
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g extended-keys on
set -g mouse on
set -g renumber-windows on
set -g default-terminal "tmux-256color"
# Pass cursor style sequences through to the outer terminal:
# Ss = set cursor style (bar/block/underline, blinking/steady)
# Se = reset cursor to default style
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -sg escape-time 10

# set -g pane-border-lines single
# set -g pane-active-border-style 'fg=green,bg=green'
# set -g pane-border-style bg=gray

set -s set-clipboard on
set -g allow-passthrough

# Forward Shift+Enter (CSI u) to inner apps (e.g. Claude Code line breaks)
set -as terminal-features ',*:extkeys'
bind -n S-Enter send-keys "\e[13;2u"

##### Prefix like GNU screen (easier than Ctrl-b on mobile)
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # press Ctrl-a twice to send it to the app (handy in shells)

# Session/window/pane management
bind R source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind s command-prompt -I "#S" "rename-session -- '%%'"
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind t new-window -c "#{pane_current_path}"
bind w kill-pane
bind q detach-client
bind p choose-tree -Zw

# Splits
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"
bind \{ previous-window
bind \} next-window
bind [ select-pane -t :.-
bind ] select-pane -t :.+

# Panes: direct navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Phone-friendly duplicates (prefix + arrow)
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# Others
bind z resize-pane -Z
bind v copy-mode

# Copy mode: stay in place after yanking (don't jump to bottom)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

##### Status bar
# The theme paints ansi green as #8cc470. This is the same hue and saturation
# (H 100, S 42) at lightness 50 instead of 60. The text uses fixed 256-palette
# indices, never the ansi names: the theme remaps colours 0-15, and its `black`
# lands on a slate gray with almost no contrast here.
set -g status-style "bg=#6eb54a,fg=colour235"
set -g window-status-style "fg=colour238"
set -g window-status-current-style "fg=colour232,bold"
set -g window-status-separator "#[fg=colour239]│#[default]"

##### Claude Code session state in the tab
# ~/.claude/hooks/tmux-status.sh sets the window option @claude_state:
# idle (open) / busy (working) / perm (asks permission) / done (waits for you).
# Unset on windows with no Claude Code session, and those keep the plain format.
# The theme's own yellow and red at their hue and saturation, with lightness
# solved so each mark sits at APCA Lc 30 against the bar, the floor for a
# non-text mark. Recompute all three if the bar colour changes, the values are
# tied to it. Lc 55 is the ceiling here, so nothing on this bar reaches the
# Lc 60 that body text wants.
set -g @claude_dot "#{?#{==:#{@claude_state},busy}, #[fg=#825811]●#[default],#{?#{==:#{@claude_state},idle}, #[fg=#606060]●#[default],#{?#{@claude_state}, #[fg=#b71022]●#[default],}}}"
# The active window is shown by its own style, so drop the * and - flags and
# keep only the two that carry information the style cannot.
set -g @claude_flags "#{?window_zoomed_flag,Z,}#{?window_bell_flag,!,}"
set -g window-status-format " #I:#W#{E:@claude_flags}#{E:@claude_dot} "
set -g window-status-current-format " #I:#W#{E:@claude_flags}#{E:@claude_dot} "

# Escape hatch for a marker left behind by a session that died without exiting
bind C set -w -u @claude_state

##### Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm || true'
